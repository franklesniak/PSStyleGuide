              .github/workflows/package.json
              .github/workflows/package-lock.json
            )
          else
            echo '::error::The validation-tool layout is unsupported.'
            exit 1
          fi
          "${npm_environment[@]}" npm --prefix .github/workflows ls --all
          git diff --exit-code -- "${immutable_inputs[@]}"

      - name: Set up isolated Python 3.12
        if: steps.toolchain.outputs.validation == 'full'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          # Preserve setup-python's installed 3.12/x64 selection and exports.
          # Missing hosted cache fails closed; no runtime download or system fallback.
          cache_root='/opt/hostedtoolcache/Python'
          test -d "${cache_root}"
          test ! -L "${cache_root}"
          resolved_cache="$(realpath -e -- "${cache_root}")"
          test "${resolved_cache}" = "${cache_root}"
          selected_python=''
          versions="$(find "${cache_root}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -Vr)"
          while IFS= read -r version; do
            [[ "${version}" =~ ^3\.12\.[0-9]+$ ]] || continue
            candidate="${cache_root}/${version}/x64"
            if [[ -d "${candidate}" && ! -L "${candidate}" &&
              -f "${candidate}.complete" && ! -L "${candidate}.complete" ]]; then
              resolved_candidate="$(realpath -e -- "${candidate}")"
              test "${resolved_candidate}" = "${candidate}"
              selected_python="${candidate}"
              break
            fi
          done <<< "${versions}"
          test -n "${selected_python}"
          for required_directory in bin lib; do
            test -d "${selected_python}/${required_directory}"
            test ! -L "${selected_python}/${required_directory}"
          done
          executable="$(realpath -e -- "${selected_python}/bin/python")"
          case "${executable}" in
            "${selected_python}/bin/"*) ;;
            *) exit 1 ;;
          esac
          test -f "${executable}"
          test -x "${executable}"
          library_path="${LD_LIBRARY_PATH:-}"
          case "${library_path}" in
            *$'\r'*|*$'\n'*)
              echo '::error::Python library path contains a line break.'
              exit 1
              ;;
          esac
          case ":${library_path}:" in
            *":${selected_python}/lib:"*) ;;
            *) library_path="${selected_python}/lib${library_path:+:${library_path}}" ;;
          esac
          export LD_LIBRARY_PATH="${library_path}"
          observed_python="$("${executable}" -I -S -c \
            'import sys; print((sys.implementation.name, sys.version_info[:3], sys.maxsize > 2**32))')"
          test "${observed_python}" = "('cpython', (3, 12, ${version##*.}), True)"
          # Keep repository installs out of the hosted interpreter and tracked worktree.
          case "${RUNNER_TEMP}" in *$'\r'*|*$'\n'*) echo '::error::Invalid runner temporary path.'; exit 1 ;; esac
          venv="${RUNNER_TEMP}/agent-validation-python"
          if [[ -e "${venv}" || -L "${venv}" ]]; then
            echo '::error::Python venv staging destination already exists.'
            exit 1
          fi
          "${executable}" -E -P -m venv "${venv}"
          test -x "${venv}/bin/python3.12"
          observed_venv="$("${venv}/bin/python3.12" -I -S -c \
            'import sys; print((sys.implementation.name, sys.version_info[:3], sys.maxsize > 2**32))')"
          test "${observed_venv}" = "${observed_python}"
          "${venv}/bin/python3.12" -I -c \
            'import os, sys; assert os.path.samefile(sys._base_executable, sys.argv[1]); assert sys.prefix == sys.argv[2]' \
            "${executable}" "${venv}"
          printf '%s\n' "${venv}/bin" >> "${GITHUB_PATH}"
          {
            printf 'VALIDATION_PYTHON=%s/bin/python3.12\n' "${venv}"
            printf 'LD_LIBRARY_PATH=%s\n' "${LD_LIBRARY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Install locked Python validation tools
        if: steps.toolchain.outputs.validation == 'full'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" || -n "${GH_TOKEN:-}" ||
            -n "${ACTIONS_RUNTIME_TOKEN:-}" || -n "${GIT_CONFIG_COUNT:-}" ||
            -n "${GIT_CONFIG_PARAMETERS:-}" ]]; then
            echo '::error::Unexpected credential or Git configuration channel.'
            exit 1
          fi
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          test -x "${VALIDATION_PYTHON}"
          observed_minor="$("${VALIDATION_PYTHON}" -E -P -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          test "${observed_minor}" = '3.12'
          "${VALIDATION_PYTHON}" -E -P -m pip --isolated install --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple -r requirements-dev.txt
          observed_pre_commit="$("${VALIDATION_PYTHON}" -E -P -m pre_commit --version)"
          expected_pre_commit="$(sed -n 's/^pre-commit==\([^ ]*\) .*/\1/p' requirements-dev.txt)"
          test -n "${expected_pre_commit}"
          test "${observed_pre_commit}" = "pre-commit ${expected_pre_commit}"
          "${VALIDATION_PYTHON}" -E -P -m pip --isolated check

