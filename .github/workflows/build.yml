name: Build Style Guide Artifacts
on:
  push:
  pull_request:
permissions: {}
jobs:
  generator_windows_51:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: windows-2025
    timeout-minutes: 30
    permissions: {}
    outputs:
      revision: ${{ steps.proof.outputs.revision }}
    steps:
      - name: Acquire the exact revision without credentials
        id: acquire
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path Variable:PSNativeCommandUseErrorActionPreference) {
              $PSNativeCommandUseErrorActionPreference = $false
          }
          if ($env:GITHUB_SERVER_URL -cne 'https://github.com' -or
              $env:GITHUB_REPOSITORY -cne 'franklesniak/PSStyleGuide') {
              throw 'Unexpected acquisition repository.'
          }
          foreach ($strName in @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNTIME_TOKEN',
              'GIT_CONFIG_COUNT', 'GIT_CONFIG_PARAMETERS', 'GIT_DIR', 'GIT_WORK_TREE',
              'GIT_INDEX_FILE', 'GIT_OBJECT_DIRECTORY', 'GIT_ALTERNATE_OBJECT_DIRECTORIES')) {
              if ([Environment]::GetEnvironmentVariable($strName)) {
                  throw 'Unexpected credentials or external Git configuration.'
              }
          }
          $strGitPath = 'C:\Program Files\Git\bin\git.exe'
          if (-not [IO.File]::Exists($strGitPath)) {
              throw 'The fixed hosted Git application is unavailable.'
          }
          $strRevision = $env:GITHUB_SHA
          if ($strRevision -cnotmatch '^[0-9a-f]{40}$') {
              throw 'A full commit hash is required.'
          }
          if (@([IO.Directory]::EnumerateFileSystemEntries($PWD.Path)).Count -ne 0) {
              throw 'The acquisition workspace must be empty.'
          }
          $strNeutralRoot = Join-Path -Path $env:RUNNER_TEMP -ChildPath ('generator-git-' + [Guid]::NewGuid().ToString('N'))
          $strNeutralRoot = $ExecutionContext.SessionState.Path.GetUnresolvedProviderPathFromPSPath($strNeutralRoot)
          [void][IO.Directory]::CreateDirectory($strNeutralRoot)
          $strNeutralConfig = Join-Path -Path $strNeutralRoot -ChildPath 'empty.config'
          $strNeutralHooks = Join-Path -Path $strNeutralRoot -ChildPath 'hooks'
          [void][IO.Directory]::CreateDirectory($strNeutralHooks)
          [IO.File]::WriteAllText($strNeutralConfig, '', (New-Object Text.UTF8Encoding($false)))
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = $strNeutralConfig
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          & $strGitPath -c "core.hooksPath=$strNeutralHooks" -c core.autocrlf=false init --quiet .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
          & $strGitPath config --local core.hooksPath $strNeutralHooks
          if ($LASTEXITCODE -ne 0) { throw 'Git hook exclusion failed.' }
          & $strGitPath config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Git byte-preserving checkout configuration failed.' }
          & $strGitPath remote add origin 'https://github.com/franklesniak/PSStyleGuide'
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed.' }
          for ($intAttempt = 1; $intAttempt -le 3; $intAttempt++) {
              & $strGitPath -c credential.helper= -c http.extraheader= fetch --depth 1 --no-tags --no-recurse-submodules origin $strRevision
              if ($LASTEXITCODE -eq 0) { break }
              if ($intAttempt -eq 3) { throw 'Exact revision fetch failed after three attempts.' }
              Start-Sleep -Seconds 2
          }
          $arrFetched = @(& $strGitPath rev-parse --verify 'FETCH_HEAD^{commit}')
          if ($LASTEXITCODE -ne 0 -or $arrFetched.Count -ne 1 -or $arrFetched[0] -cne $strRevision) {
              throw 'Fetched commit mismatch.'
          }
          & $strGitPath checkout --quiet --detach $strRevision
          if ($LASTEXITCODE -ne 0) { throw 'Exact checkout failed.' }
          $arrHead = @(& $strGitPath rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0 -or $arrHead.Count -ne 1 -or $arrHead[0] -cne $strRevision) {
              throw 'Checked-out commit mismatch.'
          }
          # Recheck actual post-checkout state before running any repository child.
          foreach ($strName in @('GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNTIME_TOKEN', 'GIT_CONFIG_COUNT', 'GIT_CONFIG_PARAMETERS')) {
              if ([Environment]::GetEnvironmentVariable($strName)) {
                  throw 'credential-policy: unexpected credentials or command configuration'
              }
          }
          $arrOrigin = @(& $strGitPath remote get-url --all origin)
          if ($LASTEXITCODE -ne 0 -or $arrOrigin.Count -ne 1 -or
              $arrOrigin[0] -cne 'https://github.com/franklesniak/PSStyleGuide') {
              throw 'credential-policy: origin is not the exact credential-free repository'
          }
          foreach ($strPattern in @('^credential\..*', '^http\..*extraheader$', '^include(if\..*)?\.path$')) {
              $arrForbidden = @(& $strGitPath config --local --includes --name-only --get-regexp $strPattern)
              $intConfigExit = $LASTEXITCODE
              if ($intConfigExit -ne 1 -or $arrForbidden.Count -ne 0) {
                  throw 'credential-policy: persisted credentials or configuration include'
              }
              $global:LASTEXITCODE = 0
          }
          $arrEffective = @(& $strGitPath config --includes --show-origin --show-scope --name-only --list)
          if ($LASTEXITCODE -ne 0 -or $arrEffective.Count -eq 0) {
              throw 'credential-policy: effective configuration query failed'
          }
          foreach ($strEntry in $arrEffective) {
              if ($strEntry -cnotmatch '^local\s+file:\.git/config\s+[^\s]+$') {
                  throw 'credential-policy: unexpected configuration source'
              }
          }
      - name: Run the actual generator suite twice
        id: proof
        shell: powershell
        run: |
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $strPowerShellPath = [System.Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          if ([string]::IsNullOrEmpty($strPowerShellPath) -or -not [IO.File]::Exists($strPowerShellPath)) {
              throw 'The current PowerShell executable is unavailable.'
          }
          & $strPowerShellPath -NoLogo -NoProfile -NonInteractive -File './.github/workflows/Test-StyleGuideGenerator.ps1' -ExpectedHost WindowsPowerShell51
          $intGeneratorExit = $LASTEXITCODE
          if ($intGeneratorExit -isnot [int] -or $intGeneratorExit -ne 0) {
              throw 'Generator pass 1 failed.'
          }
          & $strPowerShellPath -NoLogo -NoProfile -NonInteractive -File './.github/workflows/Test-StyleGuideGenerator.ps1' -ExpectedHost WindowsPowerShell51
          $intGeneratorExit = $LASTEXITCODE
          if ($intGeneratorExit -isnot [int] -or $intGeneratorExit -ne 0) {
              throw 'Generator pass 2 failed.'
          }
          $arrHead = @(& 'C:\Program Files\Git\bin\git.exe' rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0 -or $arrHead.Count -ne 1 -or $arrHead[0] -cne $env:GITHUB_SHA) {
              throw 'Generator proof revision mismatch.'
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('revision=' + $arrHead[0] + "`n"), (New-Object Text.UTF8Encoding($false)))
