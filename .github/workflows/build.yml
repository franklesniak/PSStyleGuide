        id: verify-checkout-credentials
        shell: pwsh
        run: |
          ./.github/workflows/Test-CheckoutCredentials.ps1
      - name: Generate and verify committed artifacts
        id: generate_style_guide_artifacts
        shell: pwsh
        run: |
          ./.github/workflows/Test-StyleGuideArtifacts.ps1
  publish_committed_artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    needs: verify_generated_artifacts
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true
          allow-unsafe-pr-checkout: false
      - name: Publish committed style guide artifacts
        id: publish_committed_style_guide_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: style-guide-committed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            copilot-instructions.md
            powershell.instructions.md
            STYLE_GUIDE_CHAT.md
            STYLE_GUIDE_FULL.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
