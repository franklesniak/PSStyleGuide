name: Agent instruction current-base invalidation

on:
  workflow_run:
    workflows:
      - Agent instruction validation
    types:
      - requested
      - completed

permissions: {}

jobs:
  invalidate-stale-current-base-status:
    name: Invalidate stale current-base status
    if: github.event.workflow_run.event == 'push'
    concurrency:
      group: agent-instruction-current-base-status
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted current-base helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true
          allow-unsafe-pr-checkout: false

      - name: Invalidate affected pull request heads from live state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          SIGNAL_ACTIVITY: ${{ github.event.action }}
          SIGNAL_RUN_ID: ${{ github.event.workflow_run.id }}
          SIGNAL_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SIGNAL_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS_TARGET_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
              github.run_id }}
        run: >-
          node .github/workflows/Set-AgentInstructionCurrentBaseStatus.mjs
          invalidate
