name: Agent instruction validation
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
permissions: {}
jobs:
  accepted-policy:
    name: Classify maintenance and validate ordinary instructions
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Acquire accepted policy without credentials
        id: acquire
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_SERVER_URL -cne 'https://github.com' -or
              $env:GITHUB_REPOSITORY -cne 'franklesniak/PSStyleGuide') {
              throw 'Unexpected acquisition repository.'
          }
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN -or $env:ACTIONS_RUNTIME_TOKEN -or
              $env:GIT_CONFIG_COUNT -or $env:GIT_CONFIG_PARAMETERS) {
              throw 'Unexpected credentials or external Git configuration.'
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = '/dev/null'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $strRevision = if ($env:EXPECTED_BASE) { $env:EXPECTED_BASE } else { $env:GITHUB_SHA }
          if ($strRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'A full commit hash is required.' }
          if (@([IO.Directory]::EnumerateFileSystemEntries($PWD.Path)).Count -ne 0) {
              throw 'The acquisition workspace must be empty.'
          }
          & /usr/bin/git -c core.hooksPath=/dev/null init --quiet .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
          & /usr/bin/git remote add origin 'https://github.com/franklesniak/PSStyleGuide'
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed.' }
          for ($intAttempt = 1; $intAttempt -le 3; $intAttempt++) {
              & /usr/bin/git -c credential.helper= -c http.extraheader= -c core.hooksPath=/dev/null fetch --depth 1 --no-tags --no-recurse-submodules origin $strRevision
              if ($LASTEXITCODE -eq 0) { break }
              if ($intAttempt -eq 3) { throw 'Exact revision fetch failed after three attempts.' }
              Start-Sleep -Seconds 2
          }
          $strFetched = & /usr/bin/git rev-parse --verify 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $strFetched -cne $strRevision) { throw 'Fetched commit mismatch.' }
          & /usr/bin/git -c core.hooksPath=/dev/null checkout --quiet --detach $strRevision
          if ($LASTEXITCODE -ne 0) { throw 'Exact checkout failed.' }
          $strHead = & /usr/bin/git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $strHead -cne $strRevision) { throw 'Checked-out commit mismatch.' }
      - name: Verify checkout credentials
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          ./.github/workflows/Test-CheckoutCredentials.ps1
      - name: Install accepted parser dependencies
        id: initialize-toolchain
        shell: pwsh
        run: |
          ./.github/workflows/Initialize-CiToolchain.ps1 -WorkflowDependencies -InstructionDependencies
      - name: Classify exact PR input and validate ordinary content
        id: validate
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_BASE -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid PR endpoints.' }
          & ./.github/workflows/Test-CheckoutCredentials.ps1
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          for ($intAttempt = 1; $intAttempt -le 3; $intAttempt++) {
              & /usr/bin/git -c credential.helper= -c http.extraheader= -c core.hooksPath=/dev/null fetch --depth 1 --no-tags --no-recurse-submodules origin $env:EXPECTED_HEAD
              if ($LASTEXITCODE -eq 0) { break }
              if ($intAttempt -eq 3) { throw 'PR data fetch failed after three attempts.' }
              Start-Sleep -Seconds 2
          }
          $strFetched = & /usr/bin/git rev-parse --verify 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $strFetched -cne $env:EXPECTED_HEAD) { throw 'PR data commit mismatch.' }
          $strResult = & node .github/workflows/Classify-InstructionMaintenance.mjs $PWD.Path $env:EXPECTED_BASE $env:EXPECTED_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance classification failed.' }
          $objResult = $strResult | ConvertFrom-Json -ErrorAction Stop
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Accepted-policy classification (not merge authority):`n`n$strResult`n")
          if ($objResult.classification -ceq 'ordinary') {
              & ./.github/workflows/Test-AgentInstructions.ps1 -InputRevision $env:EXPECTED_HEAD -PublishedBaselineRevision $env:EXPECTED_BASE
              & node .github/workflows/Validate-WorkflowPolicy.mjs --input-revision $env:EXPECTED_HEAD .github/workflows/build.yml .github/workflows/markdownlint.yml
              if ($LASTEXITCODE -ne 0) { throw 'Accepted workflow policy rejected ordinary input.' }
          } elseif ($objResult.classification -ceq 'maintenance_required') {
              Write-Output 'MAINTENANCE_REQUIRED: candidate tests, scoped owner authority and fresh independent review are required before merge. This is not ordinary policy admission.'
          } else { throw 'Unknown maintenance classification.' }
  candidate-tests:
    name: Test proposed instruction and workflow behavior
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Acquire the exact revision without credentials
        id: acquire
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_SERVER_URL -cne 'https://github.com' -or
              $env:GITHUB_REPOSITORY -cne 'franklesniak/PSStyleGuide') {
              throw 'Unexpected acquisition repository.'
          }
          if ($env:GITHUB_TOKEN -or $env:GH_TOKEN -or $env:ACTIONS_RUNTIME_TOKEN -or
              $env:GIT_CONFIG_COUNT -or $env:GIT_CONFIG_PARAMETERS) {
              throw 'Unexpected credentials or external Git configuration.'
          }
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = '/dev/null'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $strRevision = $env:GITHUB_SHA
          if ($strRevision -cnotmatch '^[0-9a-f]{40}$') { throw 'A full commit hash is required.' }
          if (@([IO.Directory]::EnumerateFileSystemEntries($PWD.Path)).Count -ne 0) {
              throw 'The acquisition workspace must be empty.'
          }
          & /usr/bin/git -c core.hooksPath=/dev/null init --quiet .
          if ($LASTEXITCODE -ne 0) { throw 'git init failed.' }
          & /usr/bin/git remote add origin 'https://github.com/franklesniak/PSStyleGuide'
          if ($LASTEXITCODE -ne 0) { throw 'git remote add failed.' }
          for ($intAttempt = 1; $intAttempt -le 3; $intAttempt++) {
              & /usr/bin/git -c credential.helper= -c http.extraheader= -c core.hooksPath=/dev/null fetch --depth 1 --no-tags --no-recurse-submodules origin $strRevision
              if ($LASTEXITCODE -eq 0) { break }
              if ($intAttempt -eq 3) { throw 'Exact revision fetch failed after three attempts.' }
              Start-Sleep -Seconds 2
          }
          $strFetched = & /usr/bin/git rev-parse --verify 'FETCH_HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $strFetched -cne $strRevision) { throw 'Fetched commit mismatch.' }
          & /usr/bin/git -c core.hooksPath=/dev/null checkout --quiet --detach $strRevision
          if ($LASTEXITCODE -ne 0) { throw 'Exact checkout failed.' }
          $strHead = & /usr/bin/git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $strHead -cne $strRevision) { throw 'Checked-out commit mismatch.' }
      - name: Verify checkout credentials
        id: verify-checkout-credentials
        shell: pwsh
        run: |
          ./.github/workflows/Test-CheckoutCredentials.ps1
      - name: Install locked test dependencies
        id: initialize-toolchain
        shell: pwsh
        run: |
          ./.github/workflows/Initialize-CiToolchain.ps1 -WorkflowDependencies -InstructionDependencies
      - name: Test proposed behavior without publication authority
        id: test
        shell: pwsh
        run: |
          ./.github/workflows/Test-AgentInstructions.ps1 -SelfTest
          & node --test .github/workflows/Classify-InstructionMaintenance.test.mjs .github/workflows/Validate-WorkflowPolicy.test.mjs .github/workflows/Test-CiHelpers.test.mjs .github/workflows/NpmTools.test.mjs .github/workflows/Check-NpmAudit.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workflow behavior tests failed.' }
